<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")</script>
<body style="font-family:sans-serif;text-align:center;background:#111;color:#eee">
<h2>Jarvis</h2>
<button id="b" style="font-size:40px;padding:30px;border-radius:50%">🎤</button>
<br><button id="s" style="margin:10px;padding:8px 14px">☁ Sign in to sync</button>
<p id="t" style="white-space:pre-wrap"></p>
<p id="info" style="font-size:12px;color:#888"></p>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyBosgoQylesH4V_yD8xhOotpp8OWkhSveI",
  authDomain:"jarvis-4d64f.firebaseapp.com",
  projectId:"jarvis-4d64f",
  appId:"1:377841047888:web:1ff60571f97d2a28597455"
});
const auth=getAuth(app),db=getFirestore(app);
let user=null,lastModel="";
onAuthStateChanged(auth,u=>{user=u;s.textContent=u?"☁ Synced: "+u.email:"☁ Sign in to sync"});
s.onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){t.textContent="Sign-in error: "+e.code}};

let dev=localStorage.getItem("dev");
if(!dev){dev=prompt("Name this device (for example Phone or Laptop)")||"Device";localStorage.setItem("dev",dev)}

async function save(text,reply){
  if(!user)return;
  try{await addDoc(collection(db,"chats"),{device:dev,user:text,reply:reply,model:lastModel,ts:serverTimestamp()})}
  catch(e){info.textContent="Sync error: "+e.code}
}

const API="https://generativelanguage.googleapis.com/v1beta/models";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let key=localStorage.getItem("gk");
if(!key){key=prompt("Paste your Gemini API key");localStorage.setItem("gk",key)}
let hist=JSON.parse(localStorage.getItem("hist")||"[]");
let cands=JSON.parse(localStorage.getItem("gc")||"[]");

async function getCands(){
  if(cands.length)return cands;
  try{
    const r=await fetch(API+"?pageSize=200&key="+key);
    const j=await r.json();
    const ok=(j.models||[])
      .filter(x=>(x.supportedGenerationMethods||[]).includes("generateContent")
        &&/^models\/gemini-/.test(x.name)
        &&!/image|tts|embed|live|audio|robot|computer|learnlm|exp/.test(x.name))
      .map(x=>x.name.replace("models/",""));
    const score=n=>/flash-lite/.test(n)?0:/flash/.test(n)?1:2;
    const ver=n=>parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[0,0])[1]);
    ok.sort((a,b)=>score(a)-score(b)||ver(b)-ver(a));
    cands=ok.slice(0,6);
  }catch(e){}
  if(!cands.length)cands=["gemini-3.8-flash"];
  return cands;
}

async function ask(contents,sys,status){
  const list=await getCands();
  let j={error:{message:"No model worked"}};
  for(const m of list){
    for(let i=0;i<3;i++){
      try{
        const r=await fetch(API+"/"+m+":generateContent?key="+key,{
          method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({system_instruction:{parts:[{text:sys}]},contents})});
        j=await r.json();
      }catch(err){return {error:{code:0,message:String(err)}}}
      if(j.error&&j.error.code==503){status("Busy, trying again...");await sleep(800*(i+1));continue}
      break;
    }
    if(j.error&&[404,429,503].includes(j.error.code))continue;
    if(!j.error){
      cands=[m,...list.filter(x=>x!==m)];
      localStorage.setItem("gc",JSON.stringify(cands));
      lastModel=m;
      info.textContent="Model: "+m;
    }
    return j;
  }
  return j;
}

const R=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!R){t.textContent="No voice input here. Please use Chrome."}
const rec=R?new R():null;
if(rec){
  rec.lang="en-IN";
  b.onclick=()=>{t.textContent="Listening...";try{rec.start()}catch(e){}};
  rec.onerror=e=>{t.textContent="Mic error: "+e.error};
  rec.onresult=async e=>{
    const text=e.results[0][0].transcript;
    t.textContent="You: "+text+"\nThinking...";
    hist.push({role:"user",parts:[{text}]});
    const sys="You are Jarvis, a witty, concise voice assistant. Reply in 1-3 short sentences. Current time: "+new Date().toLocaleString();
    const j=await ask(hist,sys,x=>{t.textContent="You: "+text+"\n"+x});
    t.textContent="You: "+text;
    let reply;
    try{reply=j.candidates[0].content.parts[0].text}
    catch(err){
      hist.pop();
      const msg=j.error?j.error.message:JSON.stringify(j);
      if(/API key/i.test(msg)){
        localStorage.removeItem("gk");
        t.textContent+="\nKey problem. Reload the page and paste a new key.";
        return;
      }
      t.textContent+="\nError: "+String(msg).slice(0,200);
      return;
    }
    hist.push({role:"model",parts:[{text:reply}]});
    hist=hist.slice(-10);
    localStorage.setItem("hist",JSON.stringify(hist));
    t.textContent+="\nJarvis: "+reply;
    speechSynthesis.speak(new SpeechSynthesisUtterance(reply));
    save(text,reply);
  };
}
</script>
</body>
