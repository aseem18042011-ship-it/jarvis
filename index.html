<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")</script>
<body style="font-family:sans-serif;text-align:center;background:#111;color:#eee">
<h2>Jarvis</h2>
<button id="b" style="font-size:40px;padding:30px;border-radius:50%">🎤</button>
<p id="t" style="white-space:pre-wrap"></p>
<script>
const MODEL="gemini-3.8-flash";
let key=localStorage.getItem("gk");
if(!key){key=prompt("Paste your Gemini API key");localStorage.setItem("gk",key)}
let hist=JSON.parse(localStorage.getItem("hist")||"[]");
const R=window.SpeechRecognition||window.webkitSpeechRecognition;
const rec=new R();rec.lang="en-IN";
b.onclick=()=>{t.textContent="Listening...";rec.start()};
rec.onerror=e=>{t.textContent="Mic error: "+e.error};
rec.onresult=async e=>{
  const text=e.results[0][0].transcript;
  t.textContent="You: "+text+"\nThinking...";
  hist.push({role:"user",parts:[{text}]});
  const sys="You are Jarvis, a witty, concise voice assistant. Reply in 1-3 short sentences. Current time: "+new Date().toLocaleString();
  const url="https://generativelanguage.googleapis.com/v1beta/models/"+MODEL+":generateContent?key="+key;
  const body=JSON.stringify({system_instruction:{parts:[{text:sys}]},contents:hist});
  let j;
  for(let i=0;i<4;i++){
    try{const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body});j=await r.json();}catch(err){j={error:{code:0,message:String(err)}};break;}
    if(!j.error||j.error.code!=503)break;
    t.textContent="You: "+text+"\nBusy, trying again...";
    await new Promise(s=>setTimeout(s,2000*(i+1)));
  }
  t.textContent="You: "+text;
  let reply;
  try{reply=j.candidates[0].content.parts[0].text}
  catch(err){hist.pop();t.textContent+="\nError: "+JSON.stringify(j).slice(0,200);return}
  hist.push({role:"model",parts:[{text:reply}]});
  hist=hist.slice(-30);
  localStorage.setItem("hist",JSON.stringify(hist));
  t.textContent+="\nJarvis: "+reply;
  speechSynthesis.speak(new SpeechSynthesisUtterance(reply));
};
</script>
</body>
