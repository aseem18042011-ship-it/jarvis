<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")</script>
<body style="font-family:sans-serif;text-align:center;background:#111;color:#eee">
<h2>Jarvis</h2>
<button id="b" style="font-size:40px;padding:30px;border-radius:50%">🎤</button>
<p id="t" style="white-space:pre-wrap">Loading...</p>
<p id="info" style="font-size:12px;color:#888;white-space:pre-wrap"></p>
<p id="hinfo" style="font-size:12px;color:#888;white-space:pre-wrap"></p>

<script>
const API="/api/chat";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let lastModel="";

window.addEventListener("unhandledrejection",e=>{
  info.textContent="Problem: "+((e.reason&&e.reason.message)||e.reason);
});
window.addEventListener("error",e=>{info.textContent="Problem: "+e.message});

let dev=localStorage.getItem("dev");
if(!dev){dev=prompt("Name this device (for example Phone or Laptop)")||"Device";localStorage.setItem("dev",dev)}

let hist=[];
try{hist=JSON.parse(localStorage.getItem("hist")||"[]")}catch(e){hist=[]}
function fixHist(){
  hist=hist.slice(-10);
  while(hist.length&&hist[0].role!=="user")hist.shift();
}
fixHist();

let cands=[];
try{cands=JSON.parse(localStorage.getItem("gc")||"[]")}catch(e){cands=[]}

async function getCands(){
  if(cands.length)return cands;
  try{
    const r=await fetch(API);
    const j=await r.json();
    const ok=(j.models||[])
      .filter(x=>(x.supportedGenerationMethods||[]).includes("generateContent")
        &&/^models\/gemini-/.test(x.name)
        &&!/image|tts|embed|live|audio|robot|computer|learnlm|exp/.test(x.name))
      .map(x=>x.name.replace("models/",""));
    const score=n=>/flash-lite/.test(n)?0:/flash/.test(n)?1:2;
    const ver=n=>parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[0,0])[1]);
    ok.sort((a,b)=>score(a)-score(b)||ver(b)-ver(a));
    cands=ok.slice(0,6);
  }catch(e){}
  if(!cands.length)cands=["gemini-3.8-flash"];
  return cands;
}

async function ask(contents,sys,status){
  const list=await getCands();
  let j={error:{message:"No model worked"}};
  for(const m of list){
    for(let i=0;i<3;i++){
      try{
        const r=await fetch(API,{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({model:m,system_instruction:{parts:[{text:sys}]},contents:contents})
        });
        j=await r.json();
      }catch(err){
        return {error:{code:0,message:"Could not reach the server ("+String(err)+"). Open Jarvis from your Vercel link."}};
      }
      if(j.error&&j.error.code==503){status("Busy, trying again...");await sleep(800*(i+1));continue}
      break;
    }
    if(j.error&&[404,429,503].includes(j.error.code))continue;
    if(!j.error){
      cands=[m].concat(list.filter(x=>x!==m));
      localStorage.setItem("gc",JSON.stringify(cands));
      lastModel=m;
      info.textContent="Model: "+m;
    }
    return j;
  }
  return j;
}

const R=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!R){
  t.textContent="No voice input in this browser. Please use Chrome.";
}else{
  const rec=new R();
  rec.lang="en-IN";
  b.onclick=()=>{t.textContent="Listening...";try{rec.start()}catch(e){}};
  rec.onerror=e=>{t.textContent="Mic error: "+e.error};
  rec.onresult=async e=>{
    const text=e.results[0][0].transcript;
    t.textContent="You: "+text+"\nThinking...";
    hist.push({role:"user",parts:[{text:text}]});
    const sys="You are Jarvis, a witty, concise voice assistant. Reply in 1-3 short sentences. Current time: "+new Date().toLocaleString();
    const j=await ask(hist,sys,x=>{t.textContent="You: "+text+"\n"+x});
    t.textContent="You: "+text;
    let reply;
    try{
      reply=j.candidates[0].content.parts[0].text;
    }catch(err){
      hist.pop();
      const msg=j.error?j.error.message:JSON.stringify(j);
      t.textContent+="\nError: "+String(msg).slice(0,250);
      return;
    }
    hist.push({role:"model",parts:[{text:reply}]});
    fixHist();
    localStorage.setItem("hist",JSON.stringify(hist));
    t.textContent+="\nJarvis: "+reply;
    speechSynthesis.speak(new SpeechSynthesisUtterance(reply));
    if(window.saveChat)window.saveChat(text,reply,lastModel);
  };
  t.textContent="Tap the mic and speak.";
}
</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyBosgoQylesH4V_yD8xhOotpp8OWkhSveI",
  authDomain:"jarvis-4d64f.firebaseapp.com",
  projectId:"jarvis-4d64f",
  appId:"1:377841047888:web:1ff60571f97d2a28597455"
});
const auth=getAuth(app),db=getFirestore(app);
const hinfo=document.getElementById("hinfo");
const ready=signInAnonymously(auth).catch(e=>{hinfo.textContent="History login error: "+e.code});

window.saveChat=async(text,reply,model)=>{
  await ready;
  if(!auth.currentUser)return;
  try{
    await addDoc(collection(db,"chats"),{
      device:localStorage.getItem("dev")||"Device",
      user:text,reply:reply,model:model||"",
      ts:serverTimestamp()
    });
  }catch(e){hinfo.textContent="History save error: "+e.code}
};
</script>
</body>
