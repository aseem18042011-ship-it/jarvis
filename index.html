<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")</script>
<body style="font-family:sans-serif;text-align:center;background:#111;color:#eee">
<h2>Jarvis</h2>
<button id="b" style="font-size:40px;padding:30px;border-radius:50%">🎤</button>
<p id="t" style="white-space:pre-wrap">Loading...</p>
<p id="info" style="font-size:12px;color:#888;white-space:pre-wrap"></p>
<p id="hinfo" style="font-size:12px;color:#888;white-space:pre-wrap"></p>
<p style="position:fixed;bottom:12px;left:0;right:0;margin:0;font-size:13px;color:#888">Made by Aseem Khan</p>

<script>
const API="/api/chat";
let lastModel="";

window.addEventListener("unhandledrejection",e=>{
  info.textContent="Problem: "+((e.reason&&e.reason.message)||e.reason);
});
window.addEventListener("error",e=>{info.textContent="Problem: "+e.message});

let dev=localStorage.getItem("dev");
if(!dev){dev=prompt("Name this device (for example Phone or Laptop)")||"Device";localStorage.setItem("dev",dev)}

let hist=[];
try{hist=JSON.parse(localStorage.getItem("hist")||"[]")}catch(e){hist=[]}
function fixHist(){
  hist=hist.slice(-6);
  while(hist.length&&hist[0].role!=="user")hist.shift();
}
fixHist();

let models=["gemini-3.5-flash-lite","gemini-3.8-flash","gemini-3.5-flash"];
try{
  const saved=JSON.parse(localStorage.getItem("gc2")||"[]");
  if(saved.length)models=saved;
}catch(e){}

let voice=null;
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices();
    voice=vs.find(x=>x.localService&&x.lang&&x.lang.startsWith("en"))
      ||vs.find(x=>x.lang&&x.lang.startsWith("en"))||null;
  }catch(e){}
}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function warm(){
  try{
    const w=new SpeechSynthesisUtterance(" ");
    w.volume=0;
    speechSynthesis.speak(w);
  }catch(e){}
}
function speakPart(s){
  if(!s.trim())return;
  try{
    const u=new SpeechSynthesisUtterance(s);
    u.lang="en-IN";
    if(voice)u.voice=voice;
    speechSynthesis.speak(u);
  }catch(e){}
}

async function streamAsk(model,contents,sys,onText){
  const r=await fetch(API,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:model,system_instruction:{parts:[{text:sys}]},contents:contents})
  });
  if(!r.ok){
    let j;
    try{j=await r.json()}catch(e){j=null}
    return {error:(j&&j.error)||{code:r.status,message:"Server problem (HTTP "+r.status+")"}};
  }
  const rd=r.body.getReader(),dec=new TextDecoder();
  let buf="",full="";
  while(true){
    const {done,value}=await rd.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,i).trim();
      buf=buf.slice(i+1);
      if(!line.startsWith("data:"))continue;
      const d=line.slice(5).trim();
      if(!d||d==="[DONE]")continue;
      try{
        const j=JSON.parse(d);
        const parts=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
        for(const p of parts){if(p.text){full+=p.text;onText(full)}}
      }catch(e){}
    }
  }
  return {text:full};
}

const R=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!R){
  t.textContent="No voice input in this browser. Please use Chrome.";
}else{
  const rec=new R();
  rec.lang="en-IN";
  b.onclick=()=>{t.textContent="Listening...";warm();try{rec.start()}catch(e){}};
  rec.onerror=e=>{t.textContent="Mic error: "+e.error};
  rec.onresult=async e=>{
    const text=e.results[0][0].transcript;
    t.textContent="You: "+text+"\nThinking...";
    hist.push({role:"user",parts:[{text:text}]});
    const sys="You are Jarvis, a witty, concise voice assistant. Reply in 1-3 short sentences. Current time: "+new Date().toLocaleString();

    try{speechSynthesis.cancel()}catch(err){}
    let spoken=0,started=false;
    const onText=full=>{
      started=true;
      t.textContent="You: "+text+"\nJarvis: "+full;
      let rest=full.slice(spoken),m;
      while((m=rest.match(/^[\s\S]*?[.!?](?:\s|$)/))){
        speakPart(m[0]);
        spoken+=m[0].length;
        rest=full.slice(spoken);
      }
    };

    let result={error:{message:"No model worked"}};
    for(const m of models){
      result=await streamAsk(m,hist,sys,onText);
      if(result.error&&!started&&[404,429,500,503].includes(Number(result.error.code))){
        t.textContent="You: "+text+"\nThinking...";
        continue;
      }
      if(!result.error){
        lastModel=m;
        models=[m].concat(models.filter(x=>x!==m));
        try{localStorage.setItem("gc2",JSON.stringify(models))}catch(err){}
      }
      break;
    }

    if(result.error||!result.text){
      hist.pop();
      const msg=result.error?result.error.message:"Empty answer. Try again.";
      t.textContent="You: "+text+"\nError: "+String(msg).slice(0,250);
      return;
    }
    const reply=result.text;
    speakPart(reply.slice(spoken));
    hist.push({role:"model",parts:[{text:reply}]});
    fixHist();
    localStorage.setItem("hist",JSON.stringify(hist));
    if(window.saveChat)window.saveChat(text,reply,lastModel);
  };
  t.textContent="Tap the mic and speak.";
}
</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyBosgoQylesH4V_yD8xhOotpp8OWkhSveI",
  authDomain:"jarvis-4d64f.firebaseapp.com",
  projectId:"jarvis-4d64f",
  appId:"1:377841047888:web:1ff60571f97d2a28597455"
});
const auth=getAuth(app),db=getFirestore(app);
const hinfo=document.getElementById("hinfo");
const ready=signInAnonymously(auth).catch(e=>{hinfo.textContent="History login error: "+e.code});

window.saveChat=async(text,reply,model)=>{
  await ready;
  if(!auth.currentUser)return;
  try{
    await addDoc(collection(db,"chats"),{
      device:localStorage.getItem("dev")||"Device",
      user:text,reply:reply,model:model||"",
      ts:serverTimestamp()
    });
  }catch(e){hinfo.textContent="History save error: "+e.code}
};
</script>
</body>
